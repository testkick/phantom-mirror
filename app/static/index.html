<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhantomMirror</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3f0; --surface:#fcfcfb; --line:#e3e1db; --text:#0b0b0b; --text2:#52514e; --muted:#8a8882;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --up:#0a7a3d; --down:#c0322f;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --line:#2e2d2a; --text:#f0efec; --text2:#c3c2b7; --muted:#8a8882;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --up:#4cc38a; --down:#e66767;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:16px;padding:18px 24px 6px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;margin:0 0 10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
#status{color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:12px 24px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.c6{grid-column:span 6}.c12{grid-column:span 12}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media(max-width:900px){.c6,.c4,.c8{grid-column:span 12}main{padding:12px}}
.num{font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:650;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kv div{font-size:12px;color:var(--muted)}.kv b{display:block;color:var(--text);font-size:14px;font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline}
.up{color:var(--up)}.down{color:var(--down)}
.scroll{overflow:auto;max-height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--text2)}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,button{font:inherit;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input{flex:1;min-width:120px}button{cursor:pointer}button:hover{border-color:var(--muted)}
button.link{border:0;background:none;color:var(--muted);padding:0}
.legend{display:flex;gap:18px;font-size:12px;color:var(--text2);margin-bottom:6px}
#chart{width:100%;height:240px;display:block}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.empty{color:var(--muted);padding:14px 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tabs button{padding:5px 11px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.tabs .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.tabs input{max-width:220px;padding:5px 10px;font-size:13px}
button.follow{padding:3px 12px;font-size:12px}
.stat-row{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px}
.stat-row div{font-size:12px;color:var(--muted)}.stat-row b{display:block;color:var(--text);font-size:18px;font-weight:600}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
#msg{font-size:12px;color:var(--down);min-height:16px}
</style>
</head>
<body>
<header>
  <h1>PhantomMirror</h1>
  <span id="status">loading…</span>
</header>
<main>
  <section class="card c4" id="s-copy"></section>
  <section class="card c4" id="s-consensus"></section>
  <section class="card c4" id="s-spot"></section>

  <section class="card c12">
    <h2>Paper equity</h2>
    <div class="legend"><span><i class="sw" style="background:var(--series-1)"></i>1:1 copy</span><span><i class="sw" style="background:var(--series-2)"></i>Consensus</span><span><i class="sw" style="background:var(--series-3)"></i>Spot copy</span></div>
    <svg id="chart" role="img" aria-label="Paper equity over time for both strategies"></svg>
  </section>

  <section class="card c12">
    <h2>Suggested traders</h2>
    <div class="tabs" id="dtabs">
      <button data-cat="perps" aria-pressed="true">Perps</button><button data-cat="spot" aria-pressed="false">Spot</button>
      <span class="sep"></span>
      <button data-win="day" aria-pressed="false">24h</button><button data-win="week" aria-pressed="true">7d</button><button data-win="month" aria-pressed="false">30d</button><button data-win="all" aria-pressed="false">All time</button>
      <span class="sep"></span>
      <input id="dfilter" placeholder="Filter by name or address">
    </div>
    <div class="scroll" style="max-height:300px"><table id="discover"></table></div>
    <p class="note" id="dnote"></p>
  </section>

  <section class="card c8">
    <h2>Tracked traders</h2>
    <form id="add">
      <input id="addr" placeholder="0x… (perps trader) or Solana address (spot trader)" required>
      <input id="label" placeholder="label (optional)" style="max-width:170px">
      <button>Add trader</button>
      <button type="button" id="seed" title="Hyperliquid-wide weekly leaderboard, not Phantom's own list">Seed HL top 10</button>
    </form>
    <div id="msg"></div>
    <div class="scroll"><table id="traders"></table></div>
  </section>

  <section class="card c4">
    <h2>Consensus board</h2>
    <div class="scroll"><table id="board"></table></div>
    <p class="note" id="rule"></p>
  </section>

  <section class="card c12">
    <h2>Open paper positions</h2>
    <div class="scroll"><table id="positions"></table></div>
  </section>

  <section class="card c12">
    <h2>Dry run · live spot execution check</h2>
    <div class="stat-row num" id="drstats"></div>
    <div class="scroll" style="max-height:300px"><table id="dryrun"></table></div>
    <p class="note" id="drnote"></p>
  </section>

  <section class="card c6">
    <h2>Trader activity</h2>
    <div class="scroll"><table id="events"></table></div>
  </section>
  <section class="card c6">
    <h2>Paper fills</h2>
    <div class="scroll"><table id="fills"></table></div>
  </section>
</main>
<div id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = (v, d=0) => v == null ? '–' : (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const signed = (v, d=2) => v == null ? '–' : `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : '−'}$${Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}</span>`;
const px = v => v == null ? '–' : Number(v).toLocaleString('en-US', {maximumSignificantDigits: 6});
const qty = v => Number(v).toLocaleString('en-US', Math.abs(v) >= 1e6 ? {notation: 'compact', maximumSignificantDigits: 4} : {maximumSignificantDigits: 5});
const short = a => a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : a;
const ago = ts => { if (!ts) return 'never'; const s = Date.now()/1000 - ts; return s < 90 ? Math.round(s)+'s ago' : s < 5400 ? Math.round(s/60)+'m ago' : s < 129600 ? Math.round(s/3600)+'h ago' : Math.round(s/86400)+'d ago'; };
const side = v => v > 0 ? '<span class="up">Long</span>' : '<span class="down">Short</span>';
let token = '', names = {}, adminRequired = false;
const colorOf = {copy: '--series-1', consensus: '--series-2', spot_copy: '--series-3'}, label = {copy: '1:1 copy', consensus: 'Consensus', spot_copy: 'Spot copy'};

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'Content-Type':'application/json', 'x-admin-token': token, ...(opts.headers||{})}});
  if (r.status === 401) { token = prompt('Admin token') || ''; if (token) return api(path, opts); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const table = (el, head, rows, empty) => {
  el.innerHTML = rows.length ? `<thead><tr>${head.map(h => `<th class="${h.startsWith('>') ? 'r' : ''}">${h.replace('>','')}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>`
    : `<tbody><tr><td class="empty">${empty}</td></tr></tbody>`;
};

function strategyCard(el, s, title, color, blurb) {
  el.innerHTML = `<h2><i class="sw" style="background:var(${color})"></i>${title}</h2>
    <div class="big num">${usd(s.equity, 2)} <span style="font-size:15px;font-weight:500">${signed(s.pnl)}</span></div>
    <div class="kv num">
      <div>Realized<b>${signed(s.realized)}</b></div><div>Unrealized<b>${signed(s.unrealized)}</b></div>
      <div>Fees paid<b>${usd(s.fees, 2)}</b></div><div>Exposure<b>${usd(s.exposure)}</b></div>
      <div>Open positions<b>${s.open_positions}</b></div><div>Fills<b>${s.fills}</b></div>
      <div>Closing fills<b>${s.closed}</b></div><div>Win rate<b>${s.win_rate == null ? '–' : Math.round(s.win_rate*100)+'%'}</b></div>
    </div><p class="note">${blurb}</p>`;
}

let series = {copy: [], consensus: [], spot_copy: []};
function drawChart() {
  const svg = $('#chart'), W = svg.clientWidth || 800, H = 240, m = {l: 58, r: 74, t: 10, b: 24};
  const all = [...series.copy, ...series.consensus, ...series.spot_copy];
  if (all.length < 2) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="13">Equity history appears after a few polls</text>`; return; }
  let x0 = Math.min(...all.map(p => p.ts)), x1 = Math.max(...all.map(p => p.ts));
  let y0 = Math.min(...all.map(p => p.equity)), y1 = Math.max(...all.map(p => p.equity));
  const pad = Math.max((y1 - y0) * .12, 1); y0 -= pad; y1 += pad; if (x1 === x0) x1 = x0 + 1;
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${usd(v)}</text>`; }
  const fmtT = t => new Date(t*1000).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  g += `<text x="${m.l}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtT(x0)}</text><text x="${W-m.r}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtT(x1)}</text>`;
  const defs = [['copy','--series-1','Copy'],['consensus','--series-2','Consensus'],['spot_copy','--series-3','Spot']];
  const ends = [];
  for (const [k, c, name] of defs) { const pts = series[k]; if (!pts.length) continue;
    g += `<path d="${pts.map((p,i) => (i?'L':'M') + X(p.ts).toFixed(1) + ' ' + Y(p.equity).toFixed(1)).join('')}" fill="none" stroke="var(${c})" stroke-width="2" stroke-linejoin="round"/>`;
    const last = pts[pts.length-1]; ends.push({y: Y(last.equity), c, name}); }
  ends.sort((a,b) => a.y - b.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;
  for (const e of ends) g += `<circle cx="${W-m.r}" cy="${e.y}" r="0"/><text x="${W-m.r+8}" y="${e.y+4}" font-size="12" fill="var(--text2)">${e.name}</text>`;
  g += `<line id="cross" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>` + defs.map(([k,c]) => `<circle id="dot-${k}" r="4" fill="var(${c})" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const near = (pts, t) => pts.reduce((a, p) => Math.abs(p.ts - t) < Math.abs(a.ts - t) ? p : a, pts[0]);
  svg.onmousemove = ev => { const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) - m.l) / (W - m.l - m.r) * (x1 - x0);
    if (t < x0 || t > x1) return svg.onmouseleave();
    let html = '', tt = null;
    for (const [k, c, name] of defs) { if (!series[k].length) continue; const p = near(series[k], t); tt = p.ts;
      const d = $('#dot-'+k); d.setAttribute('cx', X(p.ts)); d.setAttribute('cy', Y(p.equity)); d.setAttribute('visibility','visible');
      html += `<div><i class="sw" style="background:var(${c})"></i>${name} <b class="num">${usd(p.equity, 2)}</b></div>`; }
    const cr = $('#cross'); cr.setAttribute('x1', X(tt)); cr.setAttribute('x2', X(tt)); cr.setAttribute('visibility','visible');
    const tip = $('#tip'); tip.innerHTML = `<div style="color:var(--muted);margin-bottom:4px">${fmtT(tt)}</div>` + html; tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 190) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; };
  svg.onmouseleave = () => { $('#tip').style.display = 'none'; svg.querySelectorAll('#cross,[id^=dot-]').forEach(e => e.setAttribute('visibility','hidden')); };
}

async function refresh() {
  try {
    const [sum, traders, pos, board, events, fills, eq, dr] = await Promise.all(
      ['summary','traders','positions','consensus','events?limit=60','fills?limit=60','equity','dryrun'].map(p => api('/api/' + p)));
    renderDryrun(dr);
    const cfg = sum.config; adminRequired = cfg.admin_required;
    $('#status').textContent = `${cfg.demo_mode ? 'DEMO DATA · ' : ''}paper trading · last poll ${ago(sum.last_poll)}` + (sum.last_poll_error ? ` · error: ${sum.last_poll_error}` : '');
    const by = Object.fromEntries(sum.strategies.map(s => [s.strategy, s]));
    strategyCard($('#s-copy'), by.copy, '1:1 copy', '--series-1', `Mirrors each trader at their own leverage on ${usd(cfg.copy_alloc_usd)} of paper equity per trader, capped at ${cfg.copy_max_leverage}×.`);
    strategyCard($('#s-consensus'), by.consensus, 'Consensus', '--series-2', `${cfg.consensus_sizing === 'equal_weight' ? `Equity split across up to ${cfg.consensus_max_positions} positions (about ${usd(by.consensus.equity / cfg.consensus_max_positions)} each)` : `${usd(cfg.consensus_notional_usd)} per signal, max ${cfg.consensus_max_positions}`}, entered when ≥${cfg.consensus_min_traders} traders and ≥${Math.round(cfg.consensus_agreement*100)}% of holders agree, strongest first.`);
    strategyCard($('#s-spot'), by.spot_copy, 'Spot copy', '--series-3', `Mirrors Solana token buys and sells at the trader's portfolio weight on ${usd(cfg.spot_alloc_usd)} per trader, max ${Math.round(cfg.spot_max_position_pct*100)}% per token. ${(cfg.spot_fee_bps+cfg.spot_slippage_bps)/100}% cost per side.`);
    $('#rule').textContent = `Signal needs ≥${cfg.consensus_min_traders} traders and ≥${Math.round(cfg.consensus_agreement*100)}% agreement.`;
    names = Object.fromEntries(traders.map(t => [t.address, t.label || short(t.address)]));
    series = eq; drawChart();

    table($('#traders'), ['Trader','Address','>Account','Open positions','>Copy P&L','Seen',''], traders.map(t => `<tr style="${t.active ? '' : 'opacity:.45'}">
      <td>${esc(t.label) || '–'} <span class="tag">${t.chain === 'sol' ? 'spot' : 'perps'}</span></td><td class="mono" title="${esc(t.address)}">${short(t.address)}</td>
      <td class="r num">${usd(t.account_value)}</td>
      <td style="white-space:normal">${t.positions.map(p => `${esc(p.symbol)} ${t.chain === 'sol' ? `<span class="num" style="color:var(--text2)">${usd(p.notional)}</span>` : side(p.szi)}${p.baseline ? ' <span class="tag" title="Held before tracking began; not copied">pre</span>' : ''}`).join(', ') || (t.active ? 'flat' : 'removed')}${t.more_positions ? ` <span style="color:var(--muted)">+${t.more_positions} more</span>` : ''}</td>
      <td class="r num">${signed(t.copy_pnl)}</td><td>${t.last_error ? `<span class="down" title="${esc(t.last_error)}">error</span>` : ago(t.last_seen)}</td>
      <td>${t.active ? `<button class="link" data-rm="${esc(t.address)}">remove</button>` : ''}</td></tr>`), 'No traders yet. Paste a 0x address (perps) or a Solana wallet address (spot) above.');
    table($('#board'), ['Coin','>Long','>Short','Signal'], board.map(b => `<tr><td>${esc(b.coin)}</td><td class="r num">${b.long}</td><td class="r num">${b.short}</td><td>${b.signal ? side(b.signal) : '<span style="color:var(--muted)">–</span>'}</td></tr>`), 'No open positions among tracked traders.');
    table($('#positions'), ['Strategy','Source','Coin','Side','>Size','>Entry','>Mark','>Notional','>Unrealized','Opened'], pos.map(p => `<tr>
      <td><i class="sw" style="background:var(${colorOf[p.strategy]})"></i>${label[p.strategy]}</td><td>${esc(names[p.source] || p.source)}</td><td title="${esc(p.coin)}">${esc(p.symbol)}</td><td>${p.strategy === 'spot_copy' ? 'Hold' : side(p.size)}</td>
      <td class="r num">${qty(Math.abs(p.size))}</td><td class="r num">${px(p.entry_px)}</td><td class="r num">${px(p.mid)}</td><td class="r num">${usd(p.notional)}</td><td class="r num">${signed(p.unrealized)}</td><td>${ago(p.opened_at)}</td></tr>`), 'No open paper positions.');
    table($('#events'), ['When','Trader','Action','Coin','>Size','>Price'], events.map(e => `<tr><td>${ago(e.ts)}</td><td>${esc(e.label || short(e.address))}</td><td>${e.kind}</td><td title="${esc(e.coin)}">${esc(e.symbol)}</td><td class="r num">${qty(e.prev_szi)} → ${qty(e.new_szi)}</td><td class="r num">${px(e.px)}</td></tr>`), 'Nothing yet. Events appear when a tracked trader changes a position.');
    table($('#fills'), ['When','Strategy','Coin','>Qty','>Price','>Realized','Reason'], fills.map(f => `<tr><td>${ago(f.ts)}</td><td>${label[f.strategy] || f.strategy}</td><td title="${esc(f.coin)}">${esc(f.symbol)}</td><td class="r num">${f.delta > 0 ? '+' : '−'}${qty(Math.abs(f.delta))}</td><td class="r num">${px(f.px)}</td><td class="r num">${f.closing ? signed(f.realized_pnl) : '–'}</td><td>${esc(f.reason)}</td></tr>`), 'No paper fills yet.');
  } catch (e) { $('#status').textContent = 'error: ' + e.message; }
}

let dcat = 'perps', dwin = 'week', drows = [], derr = '', dseq = 0;
async function loadDiscover() {
  const seq = ++dseq, cat = dcat, win = dwin;
  $('#discover').innerHTML = '<tbody><tr><td class="empty">Loading leaderboard…</td></tr></tbody>';
  let rows = [], err = '';
  try { rows = await api(`/api/discover?category=${cat}&window=${win}`); } catch (e) { err = e.message; }
  if (seq !== dseq) return;  // a newer tab click superseded this request
  drows = rows; derr = err;
  renderDiscover();
}
function renderDiscover() {
  const f = $('#dfilter').value.trim().toLowerCase();
  const rows = drows.filter(r => !f || r.address.toLowerCase().includes(f) || (r.name || '').toLowerCase().includes(f));
  const wr = v => v == null ? '–' : Math.round(v > 1 ? v : v * 100) + '%';
  const head = dcat === 'perps' ? ['Trader','Address','>Account','>P&L','>ROI','>Volume','']
                                : ['Trader','Wallet','>Realized P&L','>ROI','>Win rate','>Trades',''];
  const btn = r => r.tracked ? '<span class="tag">Following</span>'
    : `<button class="follow" data-follow="${esc(r.address)}" data-name="${esc(r.name || '')}">Follow</button>`;
  table($('#discover'), head, rows.map(r => dcat === 'perps'
    ? `<tr><td>${esc(r.name) || '–'}</td><td class="mono" title="${esc(r.address)}">${short(r.address)}</td><td class="r num">${usd(r.account_value)}</td><td class="r num">${signed(r.pnl, 0)}</td><td class="r num">${Math.round(r.roi * 100)}%</td><td class="r num">${usd(r.volume)}</td><td class="r">${btn(r)}</td></tr>`
    : `<tr><td>${esc(r.name) || '–'}${r.twitter ? ` <span class="tag">@${esc(r.twitter.replace(/^@/, ''))}</span>` : ''}</td><td class="mono" title="${esc(r.address)}">${short(r.address)}</td><td class="r num">${signed(r.pnl, 0)}</td><td class="r num">${Math.round(r.roi * 100)}%</td><td class="r num">${wr(r.win_rate)}</td><td class="r num">${r.trades ?? '–'}</td><td class="r">${btn(r)}</td></tr>`),
    derr || (f ? 'No matches.' : 'No traders returned for this window.'));
  $('#dnote').textContent = dcat === 'perps'
    ? 'Hyperliquid-wide leaderboard (every Phantom perps trader is on it, but it isn’t Phantom’s own Top Traders list and has no Phantom usernames). Accounts under $25K hidden.'
    : 'Solana Tracker PnL leaderboard, filtered to copyable wallets: no arbitrage or high-frequency bots (max 300 trades/day), no 95%+ win rates or 50×+ returns (launch snipers, likely insiders), at least 20 trades, no single token over 80% of profit. Names come from public labels, not Phantom usernames.';
}
$('#dtabs').onclick = ev => { const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { dcat = b.dataset.cat; if (dcat === 'spot' && dwin === 'all') dwin = 'week'; }
  if (b.dataset.win) { if (dcat === 'spot' && b.dataset.win === 'all') return; dwin = b.dataset.win; }
  $('#dtabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cat === dcat || x.dataset.win === dwin)));
  $('#dtabs [data-win="all"]').disabled = dcat === 'spot';
  loadDiscover(); };
$('#dfilter').oninput = renderDiscover;
$('#discover').onclick = async ev => { const b = ev.target.closest('[data-follow]'); if (!b) return;
  b.disabled = true; b.textContent = '…';
  try { await api('/api/traders', {method:'POST', body: JSON.stringify({address: b.dataset.follow, label: b.dataset.name})});
        drows.forEach(r => { if (r.address === b.dataset.follow) r.tracked = true; }); renderDiscover(); refresh(); }
  catch (e) { b.disabled = false; b.textContent = 'Follow'; $('#dnote').textContent = e.message; } };

function renderDryrun(d) {
  const s = d.summary, n = s.n || 0;
  $('#drstats').innerHTML = `<div>Checked<b>${n}</b></div><div>Would execute<b class="up">${s.ok || 0}</b></div><div>Blocked<b class="${s.blocked ? 'down' : ''}">${s.blocked || 0}</b></div><div>Quote errors<b>${s.errors || 0}</b></div><div>Avg cost vs mid<b>${s.avg_impact == null ? '–' : Math.round(s.avg_impact) + ' bps'}</b></div>`;
  table($('#dryrun'), ['When','Trader','Side','Token','>Size','>Paper px','>Quote px','>Cost vs mid','Result'], d.rows.map(r => `<tr>
    <td>${ago(r.ts)}</td><td>${esc(r.label || short(r.source))}</td><td>${r.side === 'buy' ? '<span class="up">Buy</span>' : '<span class="down">Sell</span>'}</td><td title="${esc(r.mint)}">${esc(r.symbol)}</td>
    <td class="r num">${usd(r.usd)}</td><td class="r num">${px(r.paper_px)}</td><td class="r num">${px(r.exec_px)}</td><td class="r num">${r.impact_bps == null ? '–' : Math.round(r.impact_bps) + ' bps'}</td>
    <td style="white-space:normal">${r.status === 'ok' ? 'Would execute' : r.status === 'blocked' ? '<span class="down">Blocked</span>' : 'Quote error'}${r.detail ? ` <span style="color:var(--muted)">· ${esc(r.detail)}</span>` : ''}</td></tr>`),
    d.enabled ? 'Nothing yet. Every spot copy trade gets a real Jupiter quote here, at live size. Nothing is signed or sent.' : 'Dry run is off (DRYRUN_ENABLED=false).');
  const L = d.limits;
  $('#drnote').textContent = `Live limits being tested: max ${usd(L.max_trade_usd)} per trade, max ${L.max_slippage_bps} bps worse than mid, stop buying after ${usd(L.daily_loss_usd)} daily loss.` +
    (d.wallet_set ? ' SOL balance checked against your wallet.' : ' Set DRYRUN_SOL_WALLET (public address) to also check your SOL balance.');
}

$('#add').onsubmit = async ev => { ev.preventDefault(); $('#msg').textContent = '';
  try { await api('/api/traders', {method:'POST', body: JSON.stringify({address: $('#addr').value, label: $('#label').value})}); $('#addr').value = $('#label').value = ''; refresh(); }
  catch (e) { $('#msg').textContent = e.message; } };
$('#seed').onclick = async () => { $('#msg').textContent = 'Fetching Hyperliquid leaderboard…';
  try { const r = await api('/api/traders/seed', {method:'POST', body: JSON.stringify({window:'week', top:10})}); $('#msg').textContent = `Added ${r.added.length} of ${r.found}.`; refresh(); }
  catch (e) { $('#msg').textContent = e.message; } };
$('#traders').onclick = async ev => { const a = ev.target.dataset.rm; if (!a) return;
  try { await api('/api/traders/' + a, {method:'DELETE'}); refresh(); } catch (e) { $('#msg').textContent = e.message; } };
addEventListener('resize', drawChart);
refresh(); loadDiscover(); setInterval(refresh, 10000);
</script>
</body>
</html>
